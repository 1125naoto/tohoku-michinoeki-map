name: 周辺スポット事前キャッシュの定期更新

# scripts/fetch_poi_cache.py を実行し、public/data/poi/*.json を最新のOverpassデータで
# 再生成する。変更があればmainへコミットし、既存のdeploy.ymlが自動的に公開へ反映する。
# 秘密鍵・APIキーは不要（Overpassは無料公開API）。

on:
  schedule:
    # 毎週月曜 03:00 JST（日曜 18:00 UTC）。全国展開後はデータ規模に応じて頻度を見直す。
    - cron: '0 18 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 周辺スポットキャッシュを再取得（全駅。一部失敗しても取得できた分は反映する）
        run: python scripts/fetch_poi_cache.py || true

      - name: 変更があればmainへコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/poi/
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "周辺スポット事前キャッシュを更新 (自動生成)"
            git push
          fi
