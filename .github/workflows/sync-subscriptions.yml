name: 道の駅ナビ全国版 購入者ゲートの同期

# scripts/sync-subscriptions.mjs を実行し、道の駅ナビのPayment Linkに紐づく有効な契約者だけの一覧
# （public/access-control/active.json、SHA-256ハッシュのみ）を再生成する。
# お宝ファインダー等、他プロダクトのデータには一切アクセスしない
# （Payment Link/Price IDでスコープしている）。
#
# secrets.STRIPE_API_KEY が未設定の間は何もせず正常終了する（fail-closed。
# 既に発行済みのアクセスを誤って剥奪しない。ただし新規購入の反映・解約の失効も
# 進まない）。このRepository Secretは読み取り専用（Subscriptions/Checkout Sessions: Read）の
# restricted key（このワークフロー・Claude Codeのどちらも生のキー値を扱わない）。
#
# 決済後すぐに使えるようにするための構成（cronだけでは実測3〜7時間間隔になるため）:
#  - 1回の実行の中で約55分間、1分ごとに同期する。終わる前に自分自身を workflow_dispatch で
#    起動し直す（GITHUB_TOKEN からの workflow_dispatch は新しい実行を作れる、GitHub Actions の仕様）。
#    → 決済からアクセス有効化まで、通常は同期1分以内＋デプロイ約1〜2分。
#  - cron は、連鎖が何かの理由で途切れたときの再始動（ウォッチドッグ）として残す。
#  - concurrency で同時に動くのは1つだけ（重なった起動は待機し、待機分は最新の1つにまとまる）。
#
# 既定のGITHUB_TOKENによるpushはdeploy.ymlのon:pushを起動しないため
# （refresh-poi-cache.ymlと同じ既知の挙動）、変更があれば明示的にdeploy.ymlを起動する。

on:
  schedule:
    # ウォッチドッグ（GitHub側の負荷で数時間遅れることがある。通常は自己再起動の連鎖で動く）
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-subscriptions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      LOOP_MINUTES: '55'
      INTERVAL_SECONDS: '60'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Stripe CLI
        run: |
          version=$(curl -fsSL https://api.github.com/repos/stripe/stripe-cli/releases/latest | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).tag_name.replace(/^v/, "")')
          curl -fsSL "https://github.com/stripe/stripe-cli/releases/download/v${version}/stripe_${version}_linux_x86_64.tar.gz" -o stripe.tar.gz
          tar -xzf stripe.tar.gz
          sudo mv stripe /usr/local/bin/stripe
          stripe --version

      - name: 購入者ゲートを同期（1分ごと・約55分間）
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          NAMI_ACCESS_CODE: ${{ secrets.NAMI_ACCESS_CODE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            started=$(date +%s)
            # 他のpush（デプロイ等）で main が進んでいても、毎回最新に合わせてから同期する（pushの衝突を防ぐ）
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/sync-subscriptions.mjs || echo "::warning::sync failed (次の周期で再試行)"
            sleep $(( INTERVAL_SECONDS - ( $(date +%s) - started ) > 5 ? INTERVAL_SECONDS - ( $(date +%s) - started ) : 5 ))
          done

      - name: 次の同期を起動（自己再起動の連鎖）
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-subscriptions.yml --ref main
